{% extends "layout.html" %}
{% block content %}
<div class="container-fluid">
<h5 class="mb-3">Adjust stock — {{ sku }}</h5>

<form id="adjustForm" class="card p-3">
<div class="row g-2">
<div class="col-md-4">
<label class="form-label small">Movement type</label>
<select name="txn_type" id="txn_type" class="form-select">
<option value="adjust">Adjustment (+/-)</option>
<option value="receive">Receive (+)</option>
<option value="issue">Issue (-)</option>
</select>
</div>
<div class="col-md-3">
<label class="form-label small">Qty</label>
<input name="qty" id="qty" type="number" step="0.01" class="form-control" placeholder="Qty" required>
<small class="text-muted" id="qtyHint">Positive to add, negative to remove.</small>
</div>
<div class="col-md-3">
<label class="form-label small">Location</label>
<select name="location" class="form-select">
<option value="">No specific location</option>
{% for loc in locations %}
<option value="{{ loc }}">{{ loc }}</option>
{% endfor %}
</select>
</div>
<div class="col-md-2 text-end d-flex align-items-end justify-content-end">
<button class="btn btn-primary w-100" type="submit">Apply</button>
</div>
</div>

<div class="mt-3">
<textarea name="note" class="form-control" rows="3" placeholder="Reason / note (optional)"></textarea>
</div>

<div id="adjustAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
</form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('adjustForm');
  const alertBox = document.getElementById('adjustAlert');
  const txnType = document.getElementById('txn_type');
  const qtyHint = document.getElementById('qtyHint');

  function updateHint() {
    if (txnType.value === 'receive') {
      qtyHint.textContent = 'Always added to stock — enter a positive number.';
    } else if (txnType.value === 'issue') {
      qtyHint.textContent = 'Always removed from stock — enter a positive number, it will be subtracted.';
    } else {
      qtyHint.textContent = 'Positive to add, negative to remove.';
    }
  }
  txnType.addEventListener('change', updateHint);
  updateHint();

  function getCsrfToken() {
    const m = document.querySelector('meta[name="csrf-token"]');
    return m ? m.getAttribute('content') : null;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    alertBox.classList.add('d-none');

    const f = e.target;
    const payload = {
      sku: "{{ sku }}",
      txn_type: f.txn_type.value,
      qty: parseFloat(f.qty.value) || 0,
      location: f.location.value,
      note: f.note.value
    };

    if (!payload.qty) {
      alertBox.textContent = 'Enter a quantity.';
      alertBox.classList.remove('d-none');
      return;
    }

    try {
      const headers = { 'Content-Type': 'application/json' };
      const csrf = getCsrfToken();
      if (csrf) headers['X-CSRFToken'] = csrf;

      const res = await fetch('/item/{{ sku }}/adjust', {
        method: 'POST',
        headers,
        body: JSON.stringify(payload)
      });
      const j = await res.json().catch(() => ({ status: 'error', message: 'Invalid server response' }));

      if (res.ok && j.status === 'ok') {
        window.location.href = '/item/{{ sku }}';
      } else {
        alertBox.textContent = j.message || 'Error saving adjustment';
        alertBox.classList.remove('d-none');
      }
    } catch (err) {
      console.error(err);
      alertBox.textContent = 'Network error';
      alertBox.classList.remove('d-none');
    }
  });
});
</script>
{% endblock %}
